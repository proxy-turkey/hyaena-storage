<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyaena Storage — Dosya Gönder</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M9 8v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M23 8v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M9 16h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <path d="M9 22.5h3M14 22.5h3M19 22.5h3" stroke="rgba(255,255,255,0.65)" stroke-width="1.4" stroke-linecap="round"/>
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#635bff"/><stop offset="0.55" stop-color="#00d4ff"/><stop offset="1" stop-color="#ff7eb3"/>
        </linearGradient></defs>
      </svg>
    </div>
    <span>Hyaena Storage</span>
  </div>
  <p class="tagline">Dosyalarını yükle, süper hızlı paylaş. Buluta şifreli dağıtılır.</p>

  <div class="card">
    <!-- Bölüm 1: Seç -->
    <div id="pick-stage">
      <div class="dropzone" id="dropzone">
        <div class="icon">⬇️</div>
        <h3>Dosyaları buraya sürükle</h3>
        <p>veya <strong>tıkla &amp; seç</strong> — <strong>Ctrl+V</strong> ile yapıştır</p>
        <div class="max" id="max-label"></div>
      </div>
      <input type="file" id="file-input" multiple hidden>

      <!-- Süre seçici -->
      <div class="expiry-row">
        <label class="muted" for="expiry-select" style="white-space:nowrap">Süre</label>
        <select id="expiry-select" aria-label="Dosya süresi">
          <option value="0">Süresiz</option>
          <option value="1">1 Saat</option>
          <option value="24">1 Gün</option>
          <option value="168">1 Hafta</option>
          <option value="720">1 Ay</option>
        </select>
      </div>

      <!-- URL ile upload -->
      <div class="url-row">
        <input type="url" id="url-input" placeholder="Dosya URL'si yapıştır (https://...)" autocomplete="off">
        <button class="btn btn-primary" id="url-btn" style="white-space:nowrap">⬇ Yükle</button>
      </div>
      <div class="url-hint">Sunucu dosyayı kendisi indirir; büyük dosyalar için idealdir.</div>
    </div>

    <!-- Bölüm 2: İlerleme -->
    <div id="progress-stage" class="hidden">
      <div class="result" style="text-align:left">
        <div class="file-label" id="up-name"></div>
        <span class="muted" id="up-size"></span>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="p1-label">Sunucuya gönderiliyor</span><span id="p1-pct">0%</span></div>
        <div class="progress-bar"><div class="progress-fill" id="p1-fill"></div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="p2-label">Telegram'a dağıtılıyor</span><span id="p2-pct">—</span></div>
        <div class="progress-bar"><div class="progress-fill" id="p2-fill"></div></div>
      </div>
      <div class="queue-box" id="queue-box"></div>
      <div style="margin-top:18px; display:flex; gap:10px; justify-content:center">
        <button class="btn btn-ghost" id="cancel-btn">İptal</button>
      </div>
    </div>

    <!-- Bölüm 3: Sonuç -->
    <div id="result-stage" class="hidden">
      <div class="result">
        <div class="check">✅</div>
        <div class="file-label" id="res-count"></div>
        <div class="res-links" id="res-links"></div>
        <div style="margin-top:18px; display:flex; gap:10px; justify-content:center">
          <button class="btn btn-primary" id="copy-all-btn">Tümünü Kopyala</button>
          <button class="btn btn-ghost" id="again-btn">Yeni dosya gönder</button>
        </div>
      </div>
    </div>

    <div class="error hidden" id="error-box"></div>
  </div>

  <script src="/static/app.js?v=20260812"></script>
</body>
</html>

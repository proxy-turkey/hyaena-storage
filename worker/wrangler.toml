name = "hyaena-storage-download"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = false

# Origin: orfi VPS (app 8080'de)
[vars]
ORIGIN_URL = "http://orfi.hyaena.qzz.io:8080"
CACHE_TTL = "2592000"  # 30 gün

# Tüm domain Worker'dan geçer (index/upload/admin/download → orfi VPS)
routes = [
  { pattern = "storage.hyaena.co.uk/*", zone_name = "hyaena.co.uk" }
]

# Dış sağlık izleme (B-02): origin /health 5 dk'da bir yoklanır,
# durum /__health-status ucundan okunur.
[triggers]
crons = ["*/5 * * * *"]
